name: docs

on:
  push:
    branches: [main]
    paths:
      - "src_docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Skip runs triggered by the bot's own [skip ci] commit below, so the
    # workflow does not trigger itself in a loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Build docs
        run: ./build.sh build

      - name: Commit built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to docs/, nothing to commit."
            exit 0
          fi
          git commit -m "docs: rebuild site [skip ci]"
          git push
